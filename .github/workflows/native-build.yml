name: native-build

# Proves the hive_call/hive_free C ABI library builds from PUBLIC sources (the
# engine is a pinned git dependency in native/cabi/Cargo.toml) and exports its
# two symbols. Runs only when the native crate or this workflow changes, or on
# demand, so the Clojure staging gate stays fast. Never publishes: the release
# .so is uploaded as a workflow artifact for inspection (shipping it inside the
# jar is card CRAFT-NATIVE-JAR-CI).

on:
  push:
    branches: [staging, main]
    paths:
      - 'native/**'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cdylib:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native/cabi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/cabi

      - name: Build release library
        run: cargo build --release --locked

      - name: Check exported C ABI
        run: |
          so=target/release/libvectorcraft.so
          ls -l "$so"
          nm -D --defined-only "$so" | grep -E ' hive_call$'
          nm -D --defined-only "$so" | grep -E ' hive_free$'

      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: libvectorcraft-linux-x86_64
          path: native/cabi/target/release/libvectorcraft.so
          retention-days: 7
