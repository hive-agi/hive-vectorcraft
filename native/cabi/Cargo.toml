[package]
name = "vectorcraft-cabi"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "JSON C ABI for the VectorCraft headless engine"

[lib]
name = "vectorcraft"
crate-type = ["cdylib", "rlib"]

[dependencies]
vectorcraft-mcp = { git = "https://github.com/storytold/vectorcraft.git", rev = "65c5953516f1ba46ce6d3cd558dd759bd6fcf09f" }
serde_json = "1"

# Size without losing the panic boundary: hive_call relies on catch_unwind,
# so panic stays "unwind" (never "abort").
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "unwind"

[dev-dependencies]
libloading = "0.8"
base64 = "0.22"
