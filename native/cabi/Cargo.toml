[package]
name = "vectorcraft-cabi"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "JSON C ABI for the VectorCraft headless engine"

[lib]
name = "vectorcraft"
crate-type = ["cdylib", "rlib"]

[dependencies]
vectorcraft-mcp = { git = "https://github.com/storytold/vectorcraft.git", rev = "0f8040ef59b88d33dd97563dbb87e8efedf046ff" }
serde_json = "1"

# Size without losing the panic boundary: hive_call relies on catch_unwind,
# so panic stays "unwind" (never "abort").
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "unwind"

[dev-dependencies]
libloading = "0.8"
base64 = "0.22"

# Mirrored verbatim from storytold/vectorcraft 0f8040ef5 Cargo.toml: workspace [patch] tables
# do not propagate to a downstream crate, so the C ABI crate must repeat them.
[patch.crates-io]
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "0cca4ac66f9f4576b3acc5f84d7a2a2ae9fb943e" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "0cca4ac66f9f4576b3acc5f84d7a2a2ae9fb943e" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "0cca4ac66f9f4576b3acc5f84d7a2a2ae9fb943e" }
hayro-cmap = { git = "https://github.com/storytold/craft-libs", rev = "0cca4ac66f9f4576b3acc5f84d7a2a2ae9fb943e" }
hayro-postscript = { git = "https://github.com/storytold/craft-libs", rev = "0cca4ac66f9f4576b3acc5f84d7a2a2ae9fb943e" }
krilla = { git = "https://github.com/storytold/craft-libs", rev = "0cca4ac66f9f4576b3acc5f84d7a2a2ae9fb943e" }
linesweeper = { git = "https://github.com/storytold/craft-libs", rev = "0cca4ac66f9f4576b3acc5f84d7a2a2ae9fb943e" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
